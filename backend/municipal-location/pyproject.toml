[project]
name = "municipal-location"
version = "0.1.0"
description = "GovFlow KSA — Municipal & Location A2A microservice (Balady requirements + OSM competitor lookup)"
authors = [
    { name = "tala", email = "223410047@psu.edu.sa" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.11",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "tavily-python>=0.7.27",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits third-party services (Nominatim/Overpass); run with -m live",
]
addopts = "-m 'not live'"
